name: Build Liv 1.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Liv Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Scaffold native Android project
        run: flutter create --platforms=android --org com.liv --project-name liv_app .

      - name: Set Android SDK 35
        run: |
          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 35/' android/app/build.gradle

      - name: Enable Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          t=p.read_text()
          permission='<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in t:
              t=t.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    '+permission)
          p.write_text(t)
          PY

      - name: Align Android build tools
        run: |
          sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+("/)/\12.1.0\2/' android/settings.gradle || true
          sed -i -E 's/(id "com.android.application" version ")[^"]+("/)/\18.5.0\2/' android/settings.gradle || true
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's/(ndkVersion = flutter.ndkVersion)/ndkVersion = "26.1.10909125"/' android/app/build.gradle || true

      - name: Extract uploaded project if present
        run: |
          if [ -f liv_app.zip ]; then
            unzip -o liv_app.zip
            if [ -d liv_app ]; then
              cp -r liv_app/* .
              cp -r liv_app/.[!.]* . 2>/dev/null || true
              rm -rf liv_app
            fi
          fi
          test -f pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Verify Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liv-1.1-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
