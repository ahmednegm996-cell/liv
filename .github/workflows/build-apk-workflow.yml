name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Scaffold native Android project
        run: flutter create --platforms=android --org com.liv --project-name liv_app .

      - name: Enable Internet for release APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          p.write_text(text)
          print(p.read_text())
          PY

      # بنرفع Kotlin و AGP و Gradle و NDK مع بعض عشان يكونوا متوافقين
      - name: Bump Kotlin, AGP, Gradle & NDK versions
        run: |
          sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\12.1.0\2/' android/settings.gradle
          sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's/(ndkVersion = flutter.ndkVersion)/ndkVersion = "26.1.10909125"/' android/app/build.gradle
          echo "----- settings.gradle -----"
          cat android/settings.gradle
          echo "----- gradle-wrapper.properties -----"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "----- app/build.gradle (head) -----"
          head -n 15 android/app/build.gradle

      - name: Unzip project if needed
        run: |
          if [ -f liv_app.zip ]; then
            echo "Found liv_app.zip — extracting..."
            unzip -o liv_app.zip
            if [ -d liv_app ]; then
              cp -r liv_app/* .
              cp -r liv_app/.[!.]* . 2>/dev/null || true
              rm -rf liv_app
            fi
          fi
          ls -la
          test -f pubspec.yaml && echo "pubspec.yaml found OK" || echo "WARNING: pubspec.yaml not found"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
