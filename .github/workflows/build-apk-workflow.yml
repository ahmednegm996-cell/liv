name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Unzip project
        run: |
          if [ -f liv_app.zip ]; then
            unzip -o liv_app.zip
            if [ -d liv_app ]; then
              cp -r liv_app/. .
              rm -rf liv_app
            fi
          fi
          test -f pubspec.yaml
          test -f assets/icon/liv_icon.png
          echo "Project and icon found."

      - name: Scaffold native Android project
        run: flutter create --platforms=android --org com.liv --project-name liv_app .

      - name: Set Android compile SDK to 35
        run: |
          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 35/' android/app/build.gradle
          grep -n "compileSdk" android/app/build.gradle || true

      - name: Enable Internet for release APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )
          p.write_text(text)
          PY

      - name: Configure Android build tools
        run: |
          sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\12.1.0\2/' android/settings.gradle
          sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's/(ndkVersion = flutter.ndkVersion)/ndkVersion = "26.1.10909125"/' android/app/build.gradle

      - name: Ensure launcher icon package is installed
        run: |
          flutter pub add --dev flutter_launcher_icons:^0.14.1
          flutter pub get

      - name: Generate launcher icon from assets/icon/liv_icon.png
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
