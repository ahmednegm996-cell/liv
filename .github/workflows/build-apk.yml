name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare project files (restore full Liv sources like #106)
        run: |
          set -e

          mkdir -p /tmp/liv_audio_preserve
          LONG="assets/audio/Meditation Music for a Calm Background  Quiet Echoes  Brioso.mp3"
          if [ -f "$LONG" ]; then
            cp "$LONG" /tmp/liv_audio_preserve/meditation_ambient.mp3
            echo "Preserved committed meditation MP3"
          elif [ -f assets/audio/meditation_ambient.mp3 ]; then
            cp assets/audio/meditation_ambient.mp3 /tmp/liv_audio_preserve/meditation_ambient.mp3
          fi

          curl -fsSL -o /tmp/liv_app_full.zip "https://raw.githubusercontent.com/ahmednegm996-cell/liv/1533a7d6bac24ead82701acb0365dc3e60f0b5da/liv_app_full.zip"
          rm -rf /tmp/liv_extract && mkdir -p /tmp/liv_extract
          unzip -qo /tmp/liv_app_full.zip -d /tmp/liv_extract

          if [ -d /tmp/liv_extract/lib ]; then
            rm -rf lib && cp -a /tmp/liv_extract/lib .
          else
            echo "ERROR: zip missing lib/" && exit 1
          fi

          mkdir -p lib/services
          curl -fsSL -o lib/services/audio_service.dart \
            "https://raw.githubusercontent.com/ahmednegm996-cell/liv/main/lib/services/audio_service.dart"

          mkdir -p lib/screens
          curl -fsSL -o lib/screens/onboarding_screen.dart \
            "https://raw.githubusercontent.com/ahmednegm996-cell/liv/6116049ae02a1931ff7bea0d9f3930f0d9b039fb/lib/screens/onboarding_screen.dart"

          if [ -f ci/ux_period_patch.py ]; then python3 ci/ux_period_patch.py; fi
          if [ -f ci/period_nav_patch.py ]; then python3 ci/period_nav_patch.py; fi
          if [ -f ci/feedback_patch.py ]; then python3 ci/feedback_patch.py || echo "WARNING: feedback_patch non-fatal"; fi
          if [ -f ci/sound_fix.py ]; then python3 ci/sound_fix.py; echo "Applied sound_fix"; fi

          if [ -d /tmp/liv_extract/assets ]; then
            mkdir -p assets && cp -a /tmp/liv_extract/assets/. assets/
          fi

          mkdir -p assets/audio
          if [ -f /tmp/liv_audio_preserve/meditation_ambient.mp3 ]; then
            cp /tmp/liv_audio_preserve/meditation_ambient.mp3 assets/audio/meditation_ambient.mp3
          fi
          if [ ! -s assets/audio/meditation_ambient.mp3 ]; then
            curl -fsSL -o assets/audio/meditation_ambient.mp3 \
              "https://raw.githubusercontent.com/ahmednegm996-cell/liv/main/assets/audio/Meditation%20Music%20for%20a%20Calm%20Background%20%20Quiet%20Echoes%20%20Brioso.mp3"
          fi
          if [ ! -s assets/audio/meditation_ambient.mp3 ]; then
            echo "ERROR: meditation_ambient.mp3 missing" && exit 1
          fi

          if [ ! -f pubspec.yaml ] && [ -f /tmp/liv_extract/pubspec.yaml ]; then
            cp /tmp/liv_extract/pubspec.yaml pubspec.yaml
          fi

          python3 ci/soundtrack_patch.py

          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          t = p.read_text(encoding="utf-8")
          if "speech_to_text" not in t:
              if "audioplayers:" in t:
                  t = re.sub(r"(audioplayers:\s*[^\n]+\n)", r"\1  speech_to_text: 6.6.2\n  permission_handler: 11.3.1\n", t, count=1)
          asset_entries = []
          if Path("assets/audio/meditation_ambient.mp3").exists():
              asset_entries.append("assets/audio/meditation_ambient.mp3")
          if Path("assets/icon/liv_icon.png").exists():
              asset_entries.append("assets/icon/liv_icon.png")
          if not asset_entries:
              raise SystemExit("ERROR: no assets")
          assets_block = "  assets:\n" + "".join(f"    - {a}\n" for a in asset_entries)
          if re.search(r"(?m)^  assets:\n(?:    - .+\n)*", t):
              t = re.sub(r"(?m)^  assets:\n(?:    - .+\n)*", assets_block, t, count=1)
          t = re.sub(r"^version:.*$", "version: 1.4.9+18", t, count=1, flags=re.M)
          p.write_text(t, encoding="utf-8")
          print("pubspec finalized")
          PY

          test -f lib/main.dart
          test -s assets/audio/meditation_ambient.mp3
          echo "Project files OK"

      - name: Ensure Android project (prefer committed modern config)
        run: |
          set -e
          cp -a lib /tmp/liv_lib_backup
          cp pubspec.yaml /tmp/liv_pubspec_backup
          mkdir -p /tmp/liv_assets_backup && cp -a assets /tmp/liv_assets_backup/ 2>/dev/null || true
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.liv --project-name liv_app . || true
          fi
          rm -rf lib && cp -a /tmp/liv_lib_backup lib
          cp /tmp/liv_pubspec_backup pubspec.yaml
          if [ -d /tmp/liv_assets_backup/assets ]; then rm -rf assets && cp -a /tmp/liv_assets_backup/assets assets; fi
          if [ -f ci/sound_fix.py ]; then python3 ci/sound_fix.py; fi

      - name: Patch Gaps + Gemini + minify off
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, textwrap

          # Canonical Gaps lives ONLY in widgets/common.dart
          # ZIP app_theme.dart also defines Gaps → remove it to avoid import collision
          theme = Path("lib/theme/app_theme.dart")
          if theme.exists():
              tt = theme.read_text(encoding="utf-8")
              if "class Gaps" in tt:
                  tt = re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n", tt)
                  theme.write_text(tt.rstrip() + "\n", encoding="utf-8")
                  print("Removed duplicate Gaps from app_theme.dart")

          common = Path("lib/widgets/common.dart")
          COMPLETE_GAPS = """
          class Gaps {
            static const h4 = SizedBox(height: 4);
            static const h6 = SizedBox(height: 6);
            static const h8 = SizedBox(height: 8);
            static const h10 = SizedBox(height: 10);
            static const h12 = SizedBox(height: 12);
            static const h14 = SizedBox(height: 14);
            static const h16 = SizedBox(height: 16);
            static const h18 = SizedBox(height: 18);
            static const h20 = SizedBox(height: 20);
            static const h24 = SizedBox(height: 24);
            static const h28 = SizedBox(height: 28);
            static const h32 = SizedBox(height: 32);
            static const w8 = SizedBox(width: 8);
            static const w12 = SizedBox(width: 12);
            static const w16 = SizedBox(width: 16);
          }
          """
          if common.exists():
              t = common.read_text(encoding="utf-8")
              if "class Gaps" in t:
                  t = re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n" + textwrap.dedent(COMPLETE_GAPS).strip() + "\n", t)
              else:
                  t = t.rstrip() + "\n" + textwrap.dedent(COMPLETE_GAPS).strip() + "\n"
              common.write_text(t.rstrip() + "\n", encoding="utf-8")
              print("Gaps canonical in common.dart")

          gs = Path("lib/services/gemini_service.dart")
          if gs.exists():
              g = gs.read_text(encoding="utf-8")
              if "personalityInsight" not in g:
                  method = "\n  Future<String> personalityInsight({required String profileSummary}) {\n    return Future.value('Keep growing with LIV!');\n  }\n"
                  idx = g.rfind("}")
                  if idx != -1:
                      gs.write_text(g[:idx] + method + g[idx:], encoding="utf-8")
          for f in [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]:
              if not f.exists():
                  continue
              t = f.read_text(encoding="utf-8")
              t = re.sub(r"minifyEnabled\s+[^\n]+", "minifyEnabled false", t)
              t = re.sub(r"shrinkResources\s+[^\n]+", "shrinkResources false", t)
              f.write_text(t, encoding="utf-8")
          PY

      - name: Force compileSdk 35 + permissions + no backup
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' "$f" || true
            [ -f "$f" ] && sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 35/' "$f" || true
          done
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit(0)
          text = p.read_text(encoding="utf-8")
          for perm in ['android.permission.INTERNET','android.permission.VIBRATE','android.permission.RECORD_AUDIO']:
              if perm not in text:
                  text = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="'+perm+'"/>', text, count=1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="LIV"', text, count=1)
          if 'allowBackup' not in text:
              text = text.replace('<application', '<application android:allowBackup="false" android:fullBackupContent="false"', 1)
          p.write_text(text, encoding="utf-8")
          print("Permissions + allowBackup=false OK")
          PY

      - name: Bump Kotlin AGP Gradle if needed
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\11.9.22\2/' android/settings.gradle || true
            sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle || true
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: Setup fixed release signing
        run: |
          set -e
          mkdir -p android/app
          USE_RELEASE_SIGNING=0
          if [ -f ci/ks.b64 ]; then
            base64 -d ci/ks.b64 > android/app/liv-release.keystore
            if keytool -list -keystore android/app/liv-release.keystore -storepass liv2026secure -alias liv >/dev/null 2>&1; then
              USE_RELEASE_SIGNING=1
            else
              rm -f android/app/liv-release.keystore
            fi
          fi
          if [ "$USE_RELEASE_SIGNING" = "1" ]; then
            printf '%s\n' 'storePassword=liv2026secure' 'keyPassword=liv2026secure' 'keyAlias=liv' 'storeFile=liv-release.keystore' > android/key.properties
          fi
          python3 ci/fix_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK (Release)
        run: |
          set -e
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/flutter_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            tail -100 /tmp/flutter_build.log || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
