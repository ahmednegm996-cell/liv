name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare project files (restore full Liv sources)
        run: |
          set -e
          echo "Downloading full Liv sources to restore all features..."
          curl -L -o /tmp/liv_app_full.zip "https://raw.githubusercontent.com/ahmednegm996-cell/liv/1533a7d6bac24ead82701acb0365dc3e60f0b5da/liv_app_full.zip"
          rm -rf /tmp/liv_extract
          mkdir -p /tmp/liv_extract
          unzip -o /tmp/liv_app_full.zip -d /tmp/liv_extract
          if [ -d /tmp/liv_extract/lib ]; then
            rm -rf lib
            cp -a /tmp/liv_extract/lib .
            echo "Restored full lib/ from zip"
            # Force good onboarding from last successful commit (avoids stub)
            curl -L -o lib/screens/onboarding_screen.dart "https://raw.githubusercontent.com/ahmednegm996-cell/liv/6116049ae02a1931ff7bea0d9f3930f0d9b039fb/lib/screens/onboarding_screen.dart"
            echo "Forced onboarding from 6116049"
            wc -l lib/screens/onboarding_screen.dart
            # Quick UX patches: yellow/red, 3s, border always visible, stronger haptic
            python3 -c "
from pathlib import Path
p = Path('lib/screens/onboarding_screen.dart')
t = p.read_text(encoding='utf-8')
t = t.replace('Color(0xFFB8956A)', 'Color(0xFFFFC107)')
t = t.replace('Color(0xFFEC4899)', 'Color(0xFFEF4444)')
t = t.replace('Duration(seconds: 5)', 'Duration(seconds: 3)')
t = t.replace('color: selected ? accent : Colors.transparent,', 'color: selected ? AppColors.primary : accent,')
if 'lightImpact' not in t:
    t = t.replace('await HapticFeedback.selectionClick();', 'await HapticFeedback.selectionClick();\n      try { await HapticFeedback.lightImpact(); } catch (_) {}')
p.write_text(t, encoding='utf-8')
print('UX patches: yellow/red/3s/haptic applied')
"
          fi
          if [ -d /tmp/liv_extract/assets ]; then
            mkdir -p assets
            cp -a /tmp/liv_extract/assets/. assets/
            echo "Restored assets/"
          fi
          if [ -f /tmp/liv_extract/pubspec.yaml ]; then
            cp /tmp/liv_extract/pubspec.yaml pubspec.yaml
            echo "Restored pubspec.yaml"
          fi
          test -f pubspec.yaml || (echo "ERROR: pubspec missing" && exit 1)
          test -f lib/main.dart || (echo "ERROR: main missing" && exit 1)
          grep -q "LivApp" lib/main.dart || (echo "ERROR: not LivApp" && exit 1)
          echo "Project files OK"

      - name: Backup Dart sources before flutter create
        run: |
          rm -rf /tmp/liv_lib_backup /tmp/liv_pubspec_backup
          cp -a lib /tmp/liv_lib_backup
          cp pubspec.yaml /tmp/liv_pubspec_backup
          mkdir -p /tmp/liv_assets_backup
          cp -a assets /tmp/liv_assets_backup/ 2>/dev/null || true

      - name: Scaffold native Android only
        run: |
          set -e
          flutter create --platforms=android --org com.liv --project-name liv_app . || true
          rm -rf lib
          cp -a /tmp/liv_lib_backup lib
          cp /tmp/liv_pubspec_backup pubspec.yaml
          if [ -d /tmp/liv_assets_backup/assets ]; then
            rm -rf assets
            cp -a /tmp/liv_assets_backup/assets assets
          fi
          grep -q "LivApp" lib/main.dart || (echo "FATAL: main overwritten" && exit 1)

      - name: Patch Gaps + Gemini + permissions + compileSdk
        run: |
          set -e
          python3 << 'PY'
from pathlib import Path
import re, textwrap
common = Path("lib/widgets/common.dart")
theme = Path("lib/theme/app_theme.dart")
if theme.exists():
    t = theme.read_text(encoding="utf-8")
    if "class Gaps" in t:
        theme.write_text(re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n", t), encoding="utf-8")
COMPLETE_GAPS = textwrap.dedent("""
class Gaps {
  static const h4 = SizedBox(height: 4);
  static const h6 = SizedBox(height: 6);
  static const h8 = SizedBox(height: 8);
  static const h10 = SizedBox(height: 10);
  static const h12 = SizedBox(height: 12);
  static const h14 = SizedBox(height: 14);
  static const h16 = SizedBox(height: 16);
  static const h18 = SizedBox(height: 18);
  static const h20 = SizedBox(height: 20);
  static const h24 = SizedBox(height: 24);
  static const h28 = SizedBox(height: 28);
  static const h32 = SizedBox(height: 32);
  static const w8 = SizedBox(width: 8);
  static const w12 = SizedBox(width: 12);
  static const w16 = SizedBox(width: 16);
}
""")
if common.exists():
    t = common.read_text(encoding="utf-8")
    if "class Gaps" in t:
        t = re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n" + COMPLETE_GAPS + "\n", t)
    else:
        t = t.rstrip() + "\n" + COMPLETE_GAPS + "\n"
    common.write_text(t.rstrip() + "\n", encoding="utf-8")
    print("Gaps OK")
gs = Path("lib/services/gemini_service.dart")
if gs.exists():
    g = gs.read_text(encoding="utf-8")
    if "personalityInsight" not in g:
        method = "\n  Future<String> personalityInsight({required String profileSummary}) {\n    return Future.value('Keep growing with LIV!');\n  }\n"
        idx = g.rfind("}")
        if idx != -1:
            gs.write_text(g[:idx] + method + g[idx:], encoding="utf-8")
PY
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' "$f" || true
          done
          python3 << 'PY'
from pathlib import Path
import re
p = Path("android/app/src/main/AndroidManifest.xml")
if p.exists():
    text = p.read_text(encoding="utf-8")
    for perm in ["android.permission.INTERNET", "android.permission.VIBRATE"]:
        tag = f'<uses-permission android:name="{perm}"/>'
        if tag not in text:
            text = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + tag, text, count=1)
    text = re.sub(r'android:label="[^"]*"', 'android:label="LIV"', text, count=1)
    p.write_text(text, encoding="utf-8")
    print("permissions OK")
PY
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\12.1.0\2/' android/settings.gradle || true
            sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle || true
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
