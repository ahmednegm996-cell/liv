name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Unzip project if needed
        run: |
          if [ -f liv_app.zip ]; then
            echo "Found liv_app.zip — extracting..."
            unzip -o liv_app.zip
            if [ -d liv_app ]; then
              cp -r liv_app/* .
              cp -r liv_app/.[!.]* . 2>/dev/null || true
              rm -rf liv_app
            fi
          fi
          ls -la
          test -f pubspec.yaml && echo "pubspec.yaml found OK" || echo "WARNING: pubspec.yaml not found"

      - name: Scaffold native Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.liv --project-name liv_app .
          else
            # ensure android exists but keep our lib/
            flutter create --platforms=android --org com.liv --project-name liv_app . || true
          fi

      - name: Set Android compile SDK to 35
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' android/app/build.gradle
            sed -i -E 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 35/' android/app/build.gradle
            grep -n "compileSdk" android/app/build.gradle || true
          fi

      - name: Enable Internet for release APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              print("manifest missing")
              raise SystemExit(0)
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission,
                  1,
              )
              p.write_text(text)
          print("INTERNET permission OK")
          PY

      - name: Bump Kotlin, AGP, Gradle & NDK versions
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\12.1.0\2/' android/settings.gradle || true
            sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle || true
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/(ndkVersion = flutter.ndkVersion)/ndkVersion = "26.1.10909125"/' android/app/build.gradle || true
            # force compileSdk again after any overwrite
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon (launcher icon)
        run: dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
