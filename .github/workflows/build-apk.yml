name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # JAVA 17
      # ------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------
      # FLUTTER
      # ------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      # ------------------------------------------------------
      # VERIFY SOURCE
      # ------------------------------------------------------
      - name: Verify repository
        run: |
          set -e

          echo "Flutter version:"
          flutter --version

          echo "Checking project..."

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d lib

          echo "Dart files:"
          find lib -maxdepth 4 -type f | sort

          echo "Repository verification passed."

      # ------------------------------------------------------
      # CREATE ANDROID PROJECT
      # ------------------------------------------------------
      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.liv \
            --project-name liv_app \
            .

          echo "Android project generated."

          test -d android
          test -f android/app/build.gradle
          test -f android/build.gradle
          test -f android/settings.gradle

      # ------------------------------------------------------
      # SHOW GENERATED ANDROID FILES
      # ------------------------------------------------------
      - name: Inspect Android project
        run: |
          set -e

          echo "Android files:"
          find android -maxdepth 4 -type f | sort

          echo ""
          echo "android/settings.gradle:"
          cat android/settings.gradle

          echo ""
          echo "android/build.gradle:"
          cat android/build.gradle

          echo ""
          echo "android/app/build.gradle:"
          cat android/app/build.gradle

      # ------------------------------------------------------
      # FIX KOTLIN VERSION
      # ------------------------------------------------------
      - name: Configure Kotlin
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------------------------
          # android/settings.gradle
          # -----------------------------------------------
          settings = Path("android/settings.gradle")

          if settings.exists():
              text = settings.read_text(encoding="utf-8")

              # Flutter 3.24 generated projects normally contain:
              #
              # id "org.jetbrains.kotlin.android" version "1.9.0"
              #
              # Upgrade it to Kotlin 1.9.22.
              text = re.sub(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>1.9.22\g<2>',
                  text
              )

              settings.write_text(text, encoding="utf-8")

          # -----------------------------------------------
          # android/build.gradle
          # -----------------------------------------------
          build = Path("android/build.gradle")

          if build.exists():
              text = build.read_text(encoding="utf-8")

              # Old Flutter projects may use:
              #
              # ext.kotlin_version = '...'
              #
              text = re.sub(
                  r"(kotlin_version\s*=\s*['\"])[^'\"]+(['\"])",
                  r"\g<1>1.9.22\g<2>",
                  text
              )

              build.write_text(text, encoding="utf-8")

          print("Kotlin configuration updated.")
          PY

          echo ""
          echo "Kotlin configuration after update:"
          grep -Rni "kotlin" android/settings.gradle android/build.gradle || true

      # ------------------------------------------------------
      # FIX ANDROID COMPILE SDK
      # ------------------------------------------------------
      - name: Configure Android SDK
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              # Groovy:
              # compileSdk flutter.compileSdkVersion
              #
              # Kotlin DSL:
              # compileSdk = flutter.compileSdkVersion
              text = re.sub(
                  r'compileSdk\s+flutter\.compileSdkVersion',
                  'compileSdk 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s+[0-9]+',
                  'compileSdk 35',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*[0-9]+',
                  'compileSdk = 35',
                  text
              )

              path.write_text(text, encoding="utf-8")

          print("Compile SDK configured.")
          PY

      # ------------------------------------------------------
      # INTERNET + VIBRATE PERMISSIONS
      # ------------------------------------------------------
      - name: Configure Android permissions
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.VIBRATE"/>',
          ]

          manifest_end = text.find(">")

          if manifest_end == -1:
              raise RuntimeError("Invalid AndroidManifest.xml")

          insertion = ""

          for permission in permissions:
              if permission not in text:
                  insertion += "\n    " + permission

          if insertion:
              insertion += "\n"
              text = (
                  text[:manifest_end + 1]
                  + insertion
                  + text[manifest_end + 1:]
              )

          # App name
          text = text.replace(
              'android:label="liv_app"',
              'android:label="LIV"'
          )

          path.write_text(text, encoding="utf-8")

          print("Android permissions configured.")
          PY

          echo ""
          echo "AndroidManifest.xml:"
          cat "$MANIFEST"

      # ------------------------------------------------------
      # GET DEPENDENCIES
      # ------------------------------------------------------
      - name: Get dependencies
        run: |
          set -e

          flutter clean
          flutter pub get

      # ------------------------------------------------------
      # VERIFY KOTLIN DEPENDENCY
      # ------------------------------------------------------
      - name: Verify Kotlin dependencies
        run: |
          set -e

          echo "Flutter pub deps:"
          flutter pub deps

          echo ""
          echo "Gradle Kotlin files:"
          find "$HOME/.gradle/caches" \
            -iname "*kotlin*1.9.22*" \
            -o -iname "*kotlin-stdlib*" \
            | head -50 || true

      # ------------------------------------------------------
      # ANALYZE
      # ------------------------------------------------------
      - name: Flutter analyze
        run: |
          set +e

          flutter analyze

          EXIT_CODE=$?

          set -e

          echo "Flutter analyze exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Flutter analyze found issues."
            echo "Continuing to Android compilation."
          else
            echo "Flutter analyze passed."
          fi

          exit 0

      # ------------------------------------------------------
      # DEBUG APK
      # ------------------------------------------------------
      - name: Build debug APK
        run: |
          set -e

          flutter build apk \
            --debug \
            --no-pub

          test -f build/app/outputs/flutter-apk/app-debug.apk

          echo "Debug APK built successfully."

      # ------------------------------------------------------
      # RELEASE APK
      # ------------------------------------------------------
      - name: Build release APK
        run: |
          set -e

          flutter build apk \
            --release \
            --no-pub

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "Release APK built successfully."

      # ------------------------------------------------------
      # SHOW APK
      # ------------------------------------------------------
      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

      # ------------------------------------------------------
      # UPLOAD RELEASE APK
      # ------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14