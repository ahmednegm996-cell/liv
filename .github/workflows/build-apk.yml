name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare project files
        run: |
          set -e
          for Z in liv_app_full.zip liv_app.zip liv_app_github.zip; do
            if [ -f "$Z" ]; then
              echo "Found $Z — extracting..."
              unzip -o "$Z" -d /tmp/liv_extract
              if [ -d /tmp/liv_extract/liv_app ]; then
                cp -a /tmp/liv_extract/liv_app/. .
              else
                cp -a /tmp/liv_extract/. .
              fi
              break
            fi
          done
          if [ -d liv_app ] && [ -f liv_app/pubspec.yaml ]; then
            echo "Found nested liv_app/ — flattening..."
            cp -a liv_app/. .
          fi
          echo "=== Root listing ==="
          ls -la
          echo "=== lib/ ==="
          ls -la lib || true
          test -f pubspec.yaml || (echo "ERROR: pubspec.yaml missing" && exit 1)
          test -f lib/main.dart || (echo "ERROR: lib/main.dart missing" && exit 1)
          grep -q "LivApp" lib/main.dart || (echo "ERROR: lib/main.dart is not Liv app" && exit 1)
          echo "Project files OK — LivApp found in main.dart"

      - name: Backup Dart sources before flutter create
        run: |
          rm -rf /tmp/liv_lib_backup /tmp/liv_pubspec_backup
          cp -a lib /tmp/liv_lib_backup
          cp pubspec.yaml /tmp/liv_pubspec_backup
          mkdir -p /tmp/liv_assets_backup
          cp -a assets /tmp/liv_assets_backup/ 2>/dev/null || true

      - name: Scaffold native Android only
        run: |
          set -e
          flutter create --platforms=android --org com.liv --project-name liv_app . || true
          rm -rf lib
          cp -a /tmp/liv_lib_backup lib
          cp /tmp/liv_pubspec_backup pubspec.yaml
          if [ -d /tmp/liv_assets_backup/assets ]; then
            rm -rf assets
            cp -a /tmp/liv_assets_backup/assets assets
          fi
          echo "=== Restored main.dart head ==="
          head -20 lib/main.dart
          grep -q "LivApp" lib/main.dart || (echo "FATAL: main.dart overwritten by demo" && exit 1)
          echo "Liv sources restored successfully"

      - name: Set Android compile SDK to 35
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' android/app/build.gradle
            sed -i -E 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 35/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' android/app/build.gradle.kts || true
          fi

      - name: Enable Internet for release APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              print("manifest missing")
              raise SystemExit(0)
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + permission, text, count=1)
              p.write_text(text)
          print("INTERNET permission OK")
          PY

      - name: Bump Kotlin, AGP, Gradle & NDK versions
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\12.1.0\2/' android/settings.gradle || true
            sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle || true
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/(ndkVersion = flutter.ndkVersion)/ndkVersion = "26.1.10909125"/' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' android/app/build.gradle
          fi

      - name: Verify Liv source before build
        run: |
          set -e
          grep -q "LivApp" lib/main.dart
          grep -q "liv_app" pubspec.yaml
          test -d lib/screens
          test -d lib/services
          echo "Pre-build verification passed"
          head -15 lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon (launcher icon)
        run: |
          test -f assets/icon/liv_icon.png && echo "Icon PNG found" || (echo "MISSING ICON" && exit 1)
          dart run flutter_launcher_icons || echo "launcher icons soft-failed"
          ls android/app/src/main/res/mipmap-*/ 2>/dev/null || true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
