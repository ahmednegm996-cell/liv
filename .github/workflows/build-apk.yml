name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare project files
        run: |
          set -e
          if [ -f lib/main.dart ] && grep -q "LivApp" lib/main.dart && [ -d lib/screens ] && [ -d lib/services ]; then
            echo "Using committed Liv sources (lib/screens present)"
          else
            for Z in liv_app_full.zip liv_app.zip liv_app_github.zip; do
              if [ -f "$Z" ]; then
                echo "Found $Z — extracting..."
                unzip -o "$Z" -d /tmp/liv_extract
                if [ -d /tmp/liv_extract/liv_app ]; then
                  cp -a /tmp/liv_extract/liv_app/. .
                else
                  cp -a /tmp/liv_extract/. .
                fi
                break
              fi
            done
            if [ -d liv_app ] && [ -f liv_app/pubspec.yaml ]; then
              echo "Found nested liv_app/ — flattening..."
              cp -a liv_app/. .
            fi
          fi
          echo "=== Root listing ==="
          ls -la
          echo "=== lib/ ==="
          ls -la lib || true
          test -f pubspec.yaml || (echo "ERROR: pubspec.yaml missing" && exit 1)
          test -f lib/main.dart || (echo "ERROR: lib/main.dart missing" && exit 1)
          grep -q "LivApp" lib/main.dart || (echo "ERROR: lib/main.dart is not Liv app" && exit 1)
          echo "Project files OK — LivApp found in main.dart"

      - name: Backup Dart sources before flutter create
        run: |
          rm -rf /tmp/liv_lib_backup /tmp/liv_pubspec_backup
          cp -a lib /tmp/liv_lib_backup
          cp pubspec.yaml /tmp/liv_pubspec_backup
          mkdir -p /tmp/liv_assets_backup
          cp -a assets /tmp/liv_assets_backup/ 2>/dev/null || true

      - name: Scaffold native Android only
        run: |
          set -e
          flutter create --platforms=android --org com.liv --project-name liv_app . || true
          rm -rf lib
          cp -a /tmp/liv_lib_backup lib
          cp /tmp/liv_pubspec_backup pubspec.yaml
          if [ -d /tmp/liv_assets_backup/assets ]; then
            rm -rf assets
            cp -a /tmp/liv_assets_backup/assets assets
          fi
          echo "=== Restored main.dart head ==="
          head -20 lib/main.dart
          grep -q "LivApp" lib/main.dart || (echo "FATAL: main.dart overwritten by demo" && exit 1)
          echo "Liv sources restored successfully"

      - name: Patch missing Gaps + Gemini method
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # Keep Gaps ONLY in common.dart to avoid duplicate-class import conflicts
          common = Path("lib/widgets/common.dart")
          theme = Path("lib/theme/app_theme.dart")

          # Remove any Gaps class from app_theme.dart if present
          if theme.exists():
              t = theme.read_text(encoding="utf-8")
              if "class Gaps" in t:
                  t2 = re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n", t)
                  theme.write_text(t2.rstrip() + "\n", encoding="utf-8")
                  print("Removed Gaps from app_theme.dart")
              else:
                  print("No Gaps in app_theme.dart (good)")

          def ensure_gaps(path: Path):
              if not path.exists():
                  print(f"skip Gaps: {path} missing")
                  return
              t = path.read_text(encoding="utf-8")
              if "class Gaps" not in t:
                  gaps = (
                      "\nclass Gaps {\n"
                      "  static const h4 = SizedBox(height: 4);\n"
                      "  static const h6 = SizedBox(height: 6);\n"
                      "  static const h8 = SizedBox(height: 8);\n"
                      "  static const h12 = SizedBox(height: 12);\n"
                      "  static const h14 = SizedBox(height: 14);\n"
                      "  static const h16 = SizedBox(height: 16);\n"
                      "  static const h24 = SizedBox(height: 24);\n"
                      "  static const w8 = SizedBox(width: 8);\n"
                      "  static const w12 = SizedBox(width: 12);\n"
                      "  static const w16 = SizedBox(width: 16);\n"
                      "}\n"
                  )
                  path.write_text(t.rstrip() + gaps, encoding="utf-8")
                  print(f"Appended Gaps class to {path}")
                  return
              changed = False
              if "static const h6" not in t:
                  t = t.replace(
                      "static const h4 = SizedBox(height: 4);",
                      "static const h4 = SizedBox(height: 4);\n  static const h6 = SizedBox(height: 6);",
                  )
                  changed = True
              if "static const h14" not in t:
                  t = t.replace(
                      "static const h12 = SizedBox(height: 12);",
                      "static const h12 = SizedBox(height: 12);\n  static const h14 = SizedBox(height: 14);",
                  )
                  changed = True
              if changed:
                  path.write_text(t, encoding="utf-8")
                  print(f"Patched Gaps in {path}")
              else:
                  print(f"Gaps OK in {path}")

          ensure_gaps(common)

          gs = Path("lib/services/gemini_service.dart")
          if gs.exists():
              g = gs.read_text(encoding="utf-8")
              if "personalityInsight" not in g:
                  method = (
                      "\n  Future<String> personalityInsight({required String profileSummary}) {\n"
                      "    return Future.value('Keep growing with LIV!');\n"
                      "  }\n"
                  )
                  idx = g.rfind("}")
                  if idx != -1:
                      g = g[:idx] + method + g[idx:]
                      gs.write_text(g, encoding="utf-8")
                      print("Added personalityInsight")
                  else:
                      print("WARNING: could not find insertion point")
              else:
                  print("personalityInsight already present")
          else:
              print("WARNING: gemini_service.dart not found")
          PY

      - name: Force compileSdk = 35 everywhere
        run: |
          set -e
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | while read f; do
            echo "Patching $f"
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' "$f" || true
            sed -i -E 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 35/' "$f" || true
            sed -i -E 's/compileSdk\s+[0-9]+/compileSdk 35/' "$f" || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.[a-zA-Z]+/compileSdk = 35/' "$f" || true
          done
          if [ -f android/local.properties ]; then
            grep -q "flutter.compileSdkVersion" android/local.properties || echo "flutter.compileSdkVersion=35" >> android/local.properties
          fi
          echo "=== compileSdk lines ==="
          grep -rn "compileSdk" android/ || true

      - name: Enable Internet permission + label
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              print("manifest missing")
              raise SystemExit(0)
          text = p.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + permission, text, count=1)
          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="LIV"',
              text,
              count=1,
          )
          p.write_text(text, encoding="utf-8")
          print("Permissions + label LIV OK")
          PY

      - name: Bump Kotlin / AGP / Gradle / NDK
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\12.1.0\2/' android/settings.gradle || true
            sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle || true
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/(id\("org.jetbrains.kotlin.android"\) version ")[^"]+(")/\12.1.0\2/' android/settings.gradle.kts || true
            sed -i -E 's/(id\("com.android.application"\) version ")[^"]+(")/\18.5.0\2/' android/settings.gradle.kts || true
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/(ndkVersion = flutter.ndkVersion)/ndkVersion = "26.1.10909125"/' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' android/app/build.gradle
            sed -i -E 's/compileSdk\s*=\s*flutter\.[a-zA-Z]+/compileSdk = 35/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' android/app/build.gradle.kts || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.[a-zA-Z]+/compileSdk = 35/' android/app/build.gradle.kts || true
          fi

      - name: Verify Liv source before build
        run: |
          set -e
          grep -q "LivApp" lib/main.dart
          grep -q "liv_app" pubspec.yaml || true
          test -d lib/screens
          test -d lib/services
          if ! grep -q "class Gaps" lib/widgets/common.dart 2>/dev/null; then
            echo "MISSING Gaps in common.dart"
            exit 1
          fi
          if grep -q "class Gaps" lib/theme/app_theme.dart 2>/dev/null; then
            echo "ERROR: Gaps must not be in app_theme.dart (duplicate)"
            exit 1
          fi
          grep -q "personalityInsight" lib/services/gemini_service.dart || (echo "MISSING personalityInsight" && exit 1)
          echo "Pre-build verification passed"
          head -15 lib/main.dart
          ls lib/screens
          ls lib/services

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: |
          test -f assets/icon/liv_icon.png && echo "Icon PNG found" || (echo "MISSING ICON" && exit 1)
          dart run flutter_launcher_icons || echo "launcher icons soft-failed"
          ls android/app/src/main/res/mipmap-*/ 2>/dev/null || true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
