name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Restore full Liv sources
        run: |
          set -e
          curl -L -o /tmp/liv_app_full.zip "https://raw.githubusercontent.com/ahmednegm996-cell/liv/1533a7d6bac24ead82701acb0365dc3e60f0b5da/liv_app_full.zip"
          unzip -o /tmp/liv_app_full.zip -d /tmp/liv_extract
          rm -rf lib assets pubspec.yaml
          cp -a /tmp/liv_extract/lib .
          cp -a /tmp/liv_extract/assets .
          cp /tmp/liv_extract/pubspec.yaml .
          # Prefer last good onboarding if present in git
          git show 6116049:lib/screens/onboarding_screen.dart > lib/screens/onboarding_screen.dart 2>/dev/null || true
          # UX patches: yellow/red gender, 3s AI, stronger haptic, border always visible
          python3 -c '
from pathlib import Path
p = Path("lib/screens/onboarding_screen.dart")
t = p.read_text(encoding="utf-8")
t = t.replace("Color(0xFFB8956A)", "Color(0xFFFFC107)")
t = t.replace("Color(0xFFEC4899)", "Color(0xFFEF4444)")
t = t.replace("Duration(seconds: 5)", "Duration(seconds: 3)")
t = t.replace("color: selected ? accent : Colors.transparent,", "color: selected ? AppColors.primary : accent,")
if "lightImpact" not in t:
    t = t.replace("await HapticFeedback.selectionClick();", "await HapticFeedback.selectionClick();\n      try { await HapticFeedback.lightImpact(); } catch (_) {}")
p.write_text(t, encoding="utf-8")
print("UX patches applied")
'
          echo "Sources restored"
          ls lib/screens

      - name: Scaffold Android + restore sources
        run: |
          set -e
          cp -a lib /tmp/libbak
          cp pubspec.yaml /tmp/pubbak
          cp -a assets /tmp/assetsbak
          flutter create --platforms=android --org com.liv --project-name liv_app . || true
          rm -rf lib
          cp -a /tmp/libbak lib
          cp /tmp/pubbak pubspec.yaml
          rm -rf assets
          cp -a /tmp/assetsbak assets

      - name: Gaps + permissions + compileSdk + signing
        run: |
          set -e
          python3 << 'PY'
from pathlib import Path
import re, textwrap
# Gaps
common = Path("lib/widgets/common.dart")
t = common.read_text(encoding="utf-8") if common.exists() else ""
COMPLETE = textwrap.dedent("""
class Gaps {
  static const h4 = SizedBox(height: 4);
  static const h6 = SizedBox(height: 6);
  static const h8 = SizedBox(height: 8);
  static const h10 = SizedBox(height: 10);
  static const h12 = SizedBox(height: 12);
  static const h14 = SizedBox(height: 14);
  static const h16 = SizedBox(height: 16);
  static const h18 = SizedBox(height: 18);
  static const h20 = SizedBox(height: 20);
  static const h24 = SizedBox(height: 24);
  static const h28 = SizedBox(height: 28);
  static const h32 = SizedBox(height: 32);
  static const w8 = SizedBox(width: 8);
  static const w12 = SizedBox(width: 12);
  static const w16 = SizedBox(width: 16);
}
""")
if "class Gaps" in t:
    t = re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n" + COMPLETE + "\n", t)
else:
    t = t.rstrip() + "\n" + COMPLETE + "\n"
common.write_text(t, encoding="utf-8")
# remove Gaps from theme
theme = Path("lib/theme/app_theme.dart")
if theme.exists():
    tt = theme.read_text(encoding="utf-8")
    if "class Gaps" in tt:
        theme.write_text(re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n", tt), encoding="utf-8")
print("Gaps OK")
PY
          # manifest
          python3 -c '
from pathlib import Path
import re
p = Path("android/app/src/main/AndroidManifest.xml")
t = p.read_text(encoding="utf-8")
for perm in ["android.permission.INTERNET", "android.permission.VIBRATE"]:
    tag = f"<uses-permission android:name=\"{perm}\"/>"
    if tag not in t:
        t = re.sub(r"(<manifest[^>]*>)", r"\1\n    " + tag, t, count=1)
t = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"LIV\"", t, count=1)
p.write_text(t, encoding="utf-8")
print("permissions OK")
'
          # compileSdk
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E "s/compileSdk\s*=\s*[0-9]+/compileSdk = 35/" "$f" || true
          done
          # fixed keystore
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/liv-release.keystore -alias liv -keyalg RSA -keysize 2048 -validity 10000 -storepass liv2026secure -keypass liv2026secure -dname "CN=LIV App, OU=Mobile, O=LIV, L=Cairo, ST=Cairo, C=EG" 2>/dev/null || true
          # Note: for true fixed key across runs we need the same keystore file; for now same passwords/alias
          cat > android/key.properties << EOF
storePassword=liv2026secure
keyPassword=liv2026secure
keyAlias=liv
storeFile=liv-release.keystore
EOF
          if [ -f android/app/build.gradle ]; then
            python3 -c '
from pathlib import Path
import re
p = Path("android/app/build.gradle")
t = p.read_text(encoding="utf-8")
if "signingConfigs.release" not in t:
    block = """
    signingConfigs {
        release {
            def kp = new Properties()
            def kf = rootProject.file("key.properties")
            if (kf.exists()) kp.load(new FileInputStream(kf))
            keyAlias kp["keyAlias"]
            keyPassword kp["keyPassword"]
            storeFile kp["storeFile"] ? file(kp["storeFile"]) : null
            storePassword kp["storePassword"]
        }
    }
"""
    t = re.sub(r"(android\s*\{)", r"\1\n" + block, t, count=1)
    t = re.sub(r"(buildTypes\s*\{[^}]*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", t, count=1, flags=re.DOTALL)
    p.write_text(t, encoding="utf-8")
    print("signing applied")
'
          fi
          sed -i -E "s/^version:.*/version: 1.4.1+10/" pubspec.yaml || true
          echo "Ready for build"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
