name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, phase-8d-compat ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare project files (Path B — ZIP UI + repo audio)
        run: |
          set -e

          mkdir -p /tmp/liv_sot /tmp/liv_audio_preserve
          if [ -f lib/services/audio_service.dart ]; then
            cp lib/services/audio_service.dart /tmp/liv_sot/audio_service.dart
            echo "Preserved repo AudioService"
          else
            echo "ERROR: repo missing lib/services/audio_service.dart" && exit 1
          fi
          if [ -f android/app/src/main/kotlin/com/liv/MainActivity.kt ]; then
            cp android/app/src/main/kotlin/com/liv/MainActivity.kt /tmp/liv_sot/MainActivity.kt
            echo "Preserved repo MainActivity"
          fi
          for f in lib/models.dart lib/screens/onboarding_screen.dart lib/screens/root_shell.dart lib/screens/period_screen.dart lib/screens/stats_screen.dart lib/screens/profile_screen.dart lib/services/app_state.dart lib/services/storage_service.dart lib/widgets/common.dart lib/services/l10n.dart lib/screens/habits_screen.dart lib/screens/dreams_screen.dart; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/liv_sot/$(basename "$f")
              echo "Preserved Phase 4/8F $f"
            else
              echo "ERROR: repo missing $f (required for Phase 8F)" && exit 1
            fi
          done
          LONG="assets/audio/Meditation Music for a Calm Background  Quiet Echoes  Brioso.mp3"
          if [ -f "$LONG" ]; then
            cp "$LONG" /tmp/liv_audio_preserve/meditation_ambient.mp3
          elif [ -f assets/audio/meditation_ambient.mp3 ]; then
            cp assets/audio/meditation_ambient.mp3 /tmp/liv_audio_preserve/meditation_ambient.mp3
          fi

          curl -fsSL -o /tmp/liv_app_full.zip \
            "https://raw.githubusercontent.com/ahmednegm996-cell/liv/1533a7d6bac24ead82701acb0365dc3e60f0b5da/liv_app_full.zip"
          rm -rf /tmp/liv_extract && mkdir -p /tmp/liv_extract
          unzip -qo /tmp/liv_app_full.zip -d /tmp/liv_extract

          if [ -d /tmp/liv_extract/lib ]; then
            rm -rf lib && cp -a /tmp/liv_extract/lib .
          else
            echo "ERROR: zip missing lib/" && exit 1
          fi

          if [ -f ci/expand_ai_overlay.py ]; then
            python3 ci/expand_ai_overlay.py
          fi
          if [ -d ci/overlays/lib ]; then
            cp -a ci/overlays/lib/. lib/
            echo "Applied ci/overlays over ZIP lib"
          fi

          if [ ! -f lib/screens/home_screen.dart ]; then
            echo "ERROR: home_screen.dart missing after ZIP" && exit 1
          fi
          cp lib/screens/home_screen.dart /tmp/liv_sot/home_from_zip.dart
          echo "LOCKED HOME (from ZIP):"
          sha256sum lib/screens/home_screen.dart /tmp/liv_sot/home_from_zip.dart

          python3 << 'PY'
          from pathlib import Path
          import re
          h = Path("lib/screens/home_screen.dart").read_text(encoding="utf-8")
          if "OverflowBox" in h:
              raise SystemExit("ERROR: ZIP home already has OverflowBox — unexpected")
          m = re.search(
              r"SizedBox\(\s*width:\s*(\d+)\s*,\s*height:\s*(\d+)\s*,\s*child:\s*Stack\([\s\S]{0,250}?"
              r"CircularProgressIndicator\(\s*value:\s*progress\s*,\s*strokeWidth:\s*([\d.]+)",
              h,
          )
          if not m:
              raise SystemExit("ERROR: progress circle SizedBox not found in ZIP home")
          w, ht, stroke = m.group(1), m.group(2), m.group(3)
          if w != "70" or ht != "70":
              raise SystemExit(f"ERROR: expected progress circle 70x70, got {w}x{ht}")
          print(f"HOME CIRCLE OK from ZIP: {w}x{ht} stroke={stroke}")
          PY

          mkdir -p lib/services
          cp /tmp/liv_sot/audio_service.dart lib/services/audio_service.dart
          echo "RESTORED AudioService from repo:"
          sha256sum lib/services/audio_service.dart
          grep -q "meditationVolume = 1.0" lib/services/audio_service.dart
          grep -q "MethodChannel('liv.feedback')" lib/services/audio_service.dart

          mkdir -p lib/screens lib/services lib/widgets
          cp /tmp/liv_sot/models.dart lib/models.dart
          cp /tmp/liv_sot/onboarding_screen.dart lib/screens/onboarding_screen.dart
          cp /tmp/liv_sot/root_shell.dart lib/screens/root_shell.dart
          cp /tmp/liv_sot/period_screen.dart lib/screens/period_screen.dart
          cp /tmp/liv_sot/stats_screen.dart lib/screens/stats_screen.dart
          cp /tmp/liv_sot/profile_screen.dart lib/screens/profile_screen.dart
          cp /tmp/liv_sot/app_state.dart lib/services/app_state.dart
          cp /tmp/liv_sot/storage_service.dart lib/services/storage_service.dart
          cp /tmp/liv_sot/common.dart lib/widgets/common.dart
          cp /tmp/liv_sot/l10n.dart lib/services/l10n.dart
          cp /tmp/liv_sot/habits_screen.dart lib/screens/habits_screen.dart
          cp /tmp/liv_sot/dreams_screen.dart lib/screens/dreams_screen.dart
          echo "RESTORED Phase 4/8F models / onboarding / root_shell / period_screen / stats / profile / app_state / storage_service / common / l10n / habits / dreams"
          sha256sum lib/models.dart lib/screens/onboarding_screen.dart lib/screens/root_shell.dart lib/screens/period_screen.dart lib/screens/stats_screen.dart lib/screens/profile_screen.dart lib/services/app_state.dart lib/services/storage_service.dart lib/widgets/common.dart lib/services/l10n.dart lib/screens/habits_screen.dart lib/screens/dreams_screen.dart

          if [ -f ci/feedback_patch.py ]; then python3 ci/feedback_patch.py || echo "WARNING: feedback_patch non-fatal"; fi

          if [ -f ci/sound_fix.py ]; then
            python3 ci/sound_fix.py
            echo "Applied sound_fix"
          fi
          if [ -f /tmp/liv_sot/MainActivity.kt ]; then
            mkdir -p android/app/src/main/kotlin/com/liv
            cp /tmp/liv_sot/MainActivity.kt android/app/src/main/kotlin/com/liv/MainActivity.kt
            if [ -f ci/sound_fix.py ]; then python3 ci/sound_fix.py; fi
          fi

          if [ -d /tmp/liv_extract/assets ]; then
            mkdir -p assets && cp -a /tmp/liv_extract/assets/. assets/
          fi
          mkdir -p assets/audio
          if [ -f /tmp/liv_audio_preserve/meditation_ambient.mp3 ]; then
            cp /tmp/liv_audio_preserve/meditation_ambient.mp3 assets/audio/meditation_ambient.mp3
          fi
          if [ ! -s assets/audio/meditation_ambient.mp3 ]; then
            curl -fsSL -o assets/audio/meditation_ambient.mp3 \
              "https://raw.githubusercontent.com/ahmednegm996-cell/liv/main/assets/audio/Meditation%20Music%20for%20a%20Calm%20Background%20%20Quiet%20Echoes%20%20Brioso.mp3"
          fi
          if [ ! -s assets/audio/meditation_ambient.mp3 ]; then
            echo "ERROR: meditation_ambient.mp3 missing" && exit 1
          fi

          if [ ! -f pubspec.yaml ] && [ -f /tmp/liv_extract/pubspec.yaml ]; then
            cp /tmp/liv_extract/pubspec.yaml pubspec.yaml
          fi

          python3 ci/soundtrack_patch.py

          if ! cmp -s lib/screens/home_screen.dart /tmp/liv_sot/home_from_zip.dart; then
            echo "WARNING: home_screen.dart changed after patches — restoring ZIP original"
            cp /tmp/liv_sot/home_from_zip.dart lib/screens/home_screen.dart
          fi
          cp /tmp/liv_sot/audio_service.dart lib/services/audio_service.dart

          if [ -f ci/home_circle_patch.py ]; then
            python3 ci/home_circle_patch.py
          else
            echo "ERROR: ci/home_circle_patch.py missing" && exit 1
          fi

          cp /tmp/liv_sot/models.dart lib/models.dart
          cp /tmp/liv_sot/onboarding_screen.dart lib/screens/onboarding_screen.dart
          cp /tmp/liv_sot/root_shell.dart lib/screens/root_shell.dart
          cp /tmp/liv_sot/period_screen.dart lib/screens/period_screen.dart
          cp /tmp/liv_sot/stats_screen.dart lib/screens/stats_screen.dart
          cp /tmp/liv_sot/profile_screen.dart lib/screens/profile_screen.dart
          cp /tmp/liv_sot/app_state.dart lib/services/app_state.dart
          cp /tmp/liv_sot/storage_service.dart lib/services/storage_service.dart
          mkdir -p lib/widgets
          cp /tmp/liv_sot/common.dart lib/widgets/common.dart
          cp /tmp/liv_sot/l10n.dart lib/services/l10n.dart
          cp /tmp/liv_sot/habits_screen.dart lib/screens/habits_screen.dart
          cp /tmp/liv_sot/dreams_screen.dart lib/screens/dreams_screen.dart
          cp /tmp/liv_sot/audio_service.dart lib/services/audio_service.dart

          echo "======== FINAL SOURCE HASHES ========"
          echo "FINAL HOME SOURCE: lib/screens/home_screen.dart (ZIP + home_circle_patch)"
          sha256sum lib/screens/home_screen.dart
          echo "FINAL AUDIO SERVICE:"
          sha256sum lib/services/audio_service.dart
          echo "FINAL MAIN ACTIVITY:"
          sha256sum android/app/src/main/kotlin/com/liv/MainActivity.kt
          echo "FINAL Phase 4/8F models / onboarding / root_shell / period_screen / stats / profile / app_state / storage_service / common / l10n / habits / dreams:"
          sha256sum lib/models.dart lib/screens/onboarding_screen.dart lib/screens/root_shell.dart lib/screens/period_screen.dart lib/screens/stats_screen.dart lib/screens/profile_screen.dart lib/services/app_state.dart lib/services/storage_service.dart lib/widgets/common.dart lib/services/l10n.dart lib/screens/habits_screen.dart lib/screens/dreams_screen.dart
          echo "===================================="

          if grep -q "OverflowBox" lib/screens/home_screen.dart; then
            echo "ERROR: OverflowBox in final home_screen" && exit 1
          fi
          python3 << 'PY'
          from pathlib import Path
          import re
          h = Path("lib/screens/home_screen.dart").read_text(encoding="utf-8")
          m = re.search(
              r"SizedBox\(\s*width:\s*(\d+)\s*,\s*height:\s*(\d+)\s*,\s*child:\s*Stack\([\s\S]{0,250}?"
              r"CircularProgressIndicator\(\s*value:\s*progress\s*,\s*strokeWidth:\s*([\d.]+)",
              h,
          )
          if not m:
              raise SystemExit("ERROR: final progress circle not found")
          if m.group(1) != "90" or m.group(2) != "90":
              raise SystemExit(f"ERROR: final circle size {m.group(1)}x{m.group(2)} != 90x90")
          print(f"VALIDATE home circle: {m.group(1)}x{m.group(2)} stroke={m.group(3)}")
          PY

          if ! grep -q "bool isFemale" lib/models.dart; then
            echo "ERROR: models missing isFemale" && exit 1
          fi
          if ! grep -q "bool trackPeriod" lib/models.dart; then
            echo "ERROR: models missing trackPeriod" && exit 1
          fi
          if ! grep -q "isFemale && state.profile.trackPeriod\|isFemale && .*trackPeriod" lib/screens/root_shell.dart; then
            echo "ERROR: root_shell missing female-only Period tab (isFemale && trackPeriod)" && exit 1
          fi
          if ! grep -q "_isFemale\|trackPeriod" lib/screens/onboarding_screen.dart; then
            echo "ERROR: onboarding missing Phase 4 gender/period fields" && exit 1
          fi
          if grep -q "Future<void> _tick\|HapticFeedback\|FixedExtentScrollController" lib/screens/onboarding_screen.dart; then
            echo "ERROR: obsolete complex onboarding (_tick / Haptic / age picker) detected" && exit 1
          fi
          if grep -q "state.profile.gender == 'female'" lib/screens/root_shell.dart; then
            echo "ERROR: obsolete period_nav_patch gender string still present in root_shell" && exit 1
          fi

          if ! grep -q "meditationVolume = 1.0" lib/services/audio_service.dart; then
            echo "ERROR: AudioService meditationVolume missing" && exit 1
          fi
          if ! grep -q "MethodChannel('liv.feedback')" lib/services/audio_service.dart; then
            echo "ERROR: AudioService missing liv.feedback channel" && exit 1
          fi

          if ! grep -q "USAGE_MEDIA" android/app/src/main/kotlin/com/liv/MainActivity.kt; then
            echo "ERROR: MainActivity missing USAGE_MEDIA" && exit 1
          fi
          if ! grep -q "liv.feedback" android/app/src/main/kotlin/com/liv/MainActivity.kt; then
            echo "ERROR: MainActivity missing liv.feedback" && exit 1
          fi
          if ! grep -q '"tick"' android/app/src/main/kotlin/com/liv/MainActivity.kt; then
            echo "ERROR: MainActivity missing tick handler" && exit 1
          fi
          if ! grep -q "onCreate" android/app/src/main/kotlin/com/liv/MainActivity.kt; then
            echo "ERROR: MainActivity missing onCreate preload" && exit 1
          fi

          test -s android/app/src/main/res/raw/liv_picker_tick.wav
          test -s android/app/src/main/res/raw/liv_button_click.wav
          test -s assets/audio/meditation_ambient.mp3

          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          t = p.read_text(encoding="utf-8")
          if "speech_to_text" not in t:
              if "audioplayers:" in t:
                  t = re.sub(r"(audioplayers:\s*[^\n]+\n)", r"\1  speech_to_text: 6.6.2\n  permission_handler: 11.3.1\n", t, count=1)
          asset_entries = []
          if Path("assets/audio/meditation_ambient.mp3").exists():
              asset_entries.append("assets/audio/meditation_ambient.mp3")
          if Path("assets/icon/liv_icon.png").exists():
              asset_entries.append("assets/icon/liv_icon.png")
          if not asset_entries:
              raise SystemExit("ERROR: no assets")
          assets_block = "  assets:\n" + "".join(f"    - {a}\n" for a in asset_entries)
          if re.search(r"(?m)^  assets:\n(?:    - .+\n)*", t):
              t = re.sub(r"(?m)^  assets:\n(?:    - .+\n)*", assets_block, t, count=1)
          if t.count("meditation_ambient.mp3") != 1:
              raise SystemExit(f"ERROR: meditation_ambient count={t.count('meditation_ambient.mp3')}")
          t = re.sub(r"^version:.*$", "version: 1.4.9+18", t, count=1, flags=re.M)
          p.write_text(t, encoding="utf-8")
          print("pubspec finalized, meditation asset once")
          PY

          test -f lib/main.dart
          if grep -q "Keep growing with LIV" lib/services/gemini_service.dart 2>/dev/null; then
            echo "ERROR: Keep growing placeholder still present" && exit 1
          fi
          grep -q "personalityInsight" lib/services/gemini_service.dart || true
          echo "VERIFY Path B OK"

      - name: Ensure Android project (prefer committed modern config)
        run: |
          set -e
          cp -a lib /tmp/liv_lib_backup
          cp pubspec.yaml /tmp/liv_pubspec_backup
          mkdir -p /tmp/liv_assets_backup && cp -a assets /tmp/liv_assets_backup/ 2>/dev/null || true
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.liv --project-name liv_app . || true
          fi
          rm -rf lib && cp -a /tmp/liv_lib_backup lib
          cp /tmp/liv_pubspec_backup pubspec.yaml
          if [ -d /tmp/liv_assets_backup/assets ]; then rm -rf assets && cp -a /tmp/liv_assets_backup/assets assets; fi
          if [ -f ci/sound_fix.py ]; then python3 ci/sound_fix.py; fi

      - name: Patch Gaps + Gemini + minify off
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, textwrap

          theme = Path("lib/theme/app_theme.dart")
          if theme.exists():
              tt = theme.read_text(encoding="utf-8")
              if "class Gaps" in tt:
                  tt = re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n", tt)
                  print("Removed duplicate Gaps from app_theme.dart")
              if "secondaryText" in tt:
                  tt = re.sub(
                      r"\n*Color\s+secondaryText\s*\([^{]*\{[\s\S]*?\n\}\s*",
                      "\n",
                      tt,
                  )
                  print("Removed duplicate secondaryText from app_theme.dart")
              theme.write_text(tt.rstrip() + "\n", encoding="utf-8")

          common = Path("lib/widgets/common.dart")
          COMPLETE_GAPS = """
          class Gaps {
            static const h4 = SizedBox(height: 4);
            static const h6 = SizedBox(height: 6);
            static const h8 = SizedBox(height: 8);
            static const h10 = SizedBox(height: 10);
            static const h12 = SizedBox(height: 12);
            static const h14 = SizedBox(height: 14);
            static const h16 = SizedBox(height: 16);
            static const h18 = SizedBox(height: 18);
            static const h20 = SizedBox(height: 20);
            static const h24 = SizedBox(height: 24);
            static const h28 = SizedBox(height: 28);
            static const h32 = SizedBox(height: 32);
            static const w8 = SizedBox(width: 8);
            static const w12 = SizedBox(width: 12);
            static const w16 = SizedBox(width: 16);
          }
          """
          if common.exists():
              t = common.read_text(encoding="utf-8")
              if "class Gaps" in t:
                  t = re.sub(r"\n*class Gaps\s*\{[\s\S]*?\n\}\s*", "\n" + textwrap.dedent(COMPLETE_GAPS).strip() + "\n", t)
              else:
                  t = t.rstrip() + "\n" + textwrap.dedent(COMPLETE_GAPS).strip() + "\n"
              common.write_text(t.rstrip() + "\n", encoding="utf-8")
              print("Gaps canonical in common.dart")

          gs = Path("lib/services/gemini_service.dart")
          if gs.exists():
              g = gs.read_text(encoding="utf-8")
              if "Keep growing with LIV" in g:
                  g = re.sub(
                      r"Future<String>\s+personalityInsight[\s\S]*?Keep growing with LIV![\s\S]*?\n  \}",
                      "",
                      g,
                  )
                  gs.write_text(g, encoding="utf-8")
                  print("Removed Keep growing placeholder")
              if "personalityInsight" not in g:
                  print("WARNING: personalityInsight missing")
              else:
                  print("personalityInsight present")
          for f in [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]:
              if not f.exists():
                  continue
              t = f.read_text(encoding="utf-8")
              t = re.sub(r"minifyEnabled\s+[^\n]+", "minifyEnabled false", t)
              t = re.sub(r"shrinkResources\s+[^\n]+", "shrinkResources false", t)
              f.write_text(t, encoding="utf-8")
          PY

      - name: Force compileSdk 35 + permissions + no backup
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 35/' "$f" || true
            [ -f "$f" ] && sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 35/' "$f" || true
          done
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit(0)
          text = p.read_text(encoding="utf-8")
          for perm in ['android.permission.INTERNET','android.permission.VIBRATE','android.permission.RECORD_AUDIO']:
              if perm not in text:
                  text = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="'+perm+'"/>', text, count=1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="LIV"', text, count=1)
          if 'allowBackup' not in text:
              text = text.replace('<application', '<application android:allowBackup="false" android:fullBackupContent="false"', 1)
          p.write_text(text, encoding="utf-8")
          print("Permissions + allowBackup=false OK")
          PY

      - name: Bump Kotlin AGP Gradle if needed
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[^"]+(")/\11.9.22\2/' android/settings.gradle || true
            sed -i -E 's/(id "com.android.application" version ")[^"]+(")/\18.5.0\2/' android/settings.gradle || true
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: Setup fixed release signing
        run: |
          set -e
          mkdir -p android/app
          USE_RELEASE_SIGNING=0
          if [ -f ci/ks.b64 ]; then
            base64 -d ci/ks.b64 > android/app/liv-release.keystore
            if keytool -list -keystore android/app/liv-release.keystore -storepass liv2026secure -alias liv >/dev/null 2>&1; then
              USE_RELEASE_SIGNING=1
            else
              rm -f android/app/liv-release.keystore
            fi
          fi
          if [ "$USE_RELEASE_SIGNING" = "1" ]; then
            printf '%s\n' 'storePassword=liv2026secure' 'keyPassword=liv2026secure' 'keyAlias=liv' 'storeFile=liv-release.keystore' > android/key.properties
          fi
          python3 ci/fix_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK (Release)
        run: |
          set -e
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/flutter_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            tail -100 /tmp/flutter_build.log || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
