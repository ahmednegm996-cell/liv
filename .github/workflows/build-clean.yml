name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source of truth
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Verify full onboarding and architecture
        run: |
          set -e
          test -f lib/main.dart
          test -f lib/models.dart
          test -f lib/services/app_state.dart
          test -f lib/screens/onboarding_screen.dart
          test -f lib/screens/home_screen.dart
          test -f assets/icon/liv_icon.png
          grep -q '_buildLanguagePage' lib/screens/onboarding_screen.dart
          grep -q '_buildGenderPage' lib/screens/onboarding_screen.dart
          grep -q '_buildAgePage' lib/screens/onboarding_screen.dart
          grep -q '_buildBodyPage' lib/screens/onboarding_screen.dart
          grep -q '_buildSleepPage' lib/screens/onboarding_screen.dart
          grep -q '_buildJobPage' lib/screens/onboarding_screen.dart
          grep -q '_buildInterestsPage' lib/screens/onboarding_screen.dart
          grep -q '_buildAnalysisPage' lib/screens/onboarding_screen.dart
          grep -q 'class WeeklyTask' lib/models.dart
          grep -q 'class DreamStep' lib/models.dart
          grep -q 'bool isFemale' lib/models.dart
          grep -q 'bool trackPeriod' lib/models.dart
          echo 'FULL SOURCE OK'

      - name: Apply only the intentional 90px circle patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/screens/home_screen.dart')
          t=p.read_text(encoding='utf-8')
          m=re.search(r'(SizedBox\(\s*width:\s*)\d+(\s*,\s*height:\s*)\d+(\s*,\s*child:\s*Stack\([\s\S]{0,900}?CircularProgressIndicator\([\s\S]{0,300}?strokeWidth:\s*)[\d.]+',t)
          if not m: raise SystemExit('circle block not found')
          block=t[m.start():m.end()]
          block=re.sub(r'width:\s*\d+','width: 90',block,count=1)
          block=re.sub(r'height:\s*\d+','height: 90',block,count=1)
          block=re.sub(r'width:\s*\d+','width: 90',block,count=1)
          block=re.sub(r'height:\s*\d+','height: 90',block,count=1)
          block=re.sub(r'strokeWidth:\s*[\d.]+','strokeWidth: 7',block,count=1)
          t=t[:m.start()]+block+t[m.end():]
          # Keep the level text compact like the target build.
          t=t.replace('fontSize: 28,','fontSize: 16,',1)
          p.write_text(t,encoding='utf-8')
          print('90x90 / stroke 7 / font 16 patch applied')
          PY
          grep -q 'width: 90' lib/screens/home_screen.dart
          grep -q 'height: 90' lib/screens/home_screen.dart
          grep -q 'strokeWidth: 7' lib/screens/home_screen.dart
          grep -q 'fontSize: 16' lib/screens/home_screen.dart

      - name: Ensure meditation asset
        run: |
          set -e
          test -s 'assets/audio/meditation_ambient.mp3' || test -s 'assets/audio/Meditation Music for a Calm Background  Quiet Echoes  Brioso.mp3'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
