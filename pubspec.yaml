name: liv_app
description: "LIV - Personal life manager: habits, goals, dreams, points, with AI help."
publish_to: 'none'
version: 1.4.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  http: ^1.2.1
  uuid: ^4.4.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  # Pin to 6.6.2 — 7.x breaks with Flutter 3.24 + current AGP (unknown property 'flutter')
  speech_to_text: 6.6.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/liv_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/liv_icon.png"
  adaptive_icon_background: "#12121A"
  adaptive_icon_foreground: "assets/icon/liv_icon.png"
  min_sdk_android: 21
