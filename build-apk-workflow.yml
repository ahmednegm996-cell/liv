name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # الخطوة الجديدة: بننشئ مشروع Flutter/Android سليم 100% بالأدوات الرسمية
      # (ده بيولّد android/ بكل ملفات الـ Gradle الصحيحة والمتوافقة مع نسخة Flutter دي)
      # قبل ما نحط كود التطبيق بتاعنا فوقه.
      - name: Scaffold native Android project
        run: flutter create --platforms=android --org com.liv --project-name liv_app .

      - name: Unzip project if needed
        run: |
          if [ -f liv_app.zip ]; then
            echo "Found liv_app.zip — extracting..."
            unzip -o liv_app.zip
            if [ -d liv_app ]; then
              cp -r liv_app/* .
              cp -r liv_app/.[!.]* . 2>/dev/null || true
              rm -rf liv_app
            fi
          fi
          ls -la
          test -f pubspec.yaml && echo "pubspec.yaml found OK" || echo "WARNING: pubspec.yaml not found"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
